# Single source of truth for the app's version.
#
# VERSION_NAME is what users see, and is bumped by hand: it carries meaning
# (MAJOR = breaking, MINOR = features, PATCH = fixes) that no script can infer.
# Must be semantic versioning; the build fails at configuration time if it isn't.
VERSION_NAME=1.0.1

# Floor for the generated version code. The real code is this plus the CI run
# number, so releases increase on their own and Play never sees a duplicate.
# Local builds get the floor exactly, which keeps debug installs stable.
#
# Raise this if Play ever holds a code higher than CI would produce - after a
# manual upload, or if .github/workflows/release.yml is renamed, since GitHub
# resets a workflow's run number when its file path changes.
VERSION_CODE_BASE=100
