name: CI

# `pull_request`, never `pull_request_target`: fork PRs run untrusted code, so
# this workflow must never see a secret. It needs none — the release build is
# left unsigned, and the app has no google-services.json dependency.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Superseded PR pushes are worth cancelling; a push to main is not. Cancelling
  # the latter would leave a commit on main with no completed run — the very gap
  # this workflow exists to close.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # This name is the status-check context. The `main: PR + green CI` ruleset
    # requires a check called exactly "Build and test", so renaming this job
    # silently makes every PR unmergeable — the required check simply never
    # reports. Change the ruleset and this line together, or not at all.
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Guards the regression that made the first release run fail with exit 126:
      # gradlew was committed as 100644 from Windows, where git records no
      # executable bit. A Windows clone with core.fileMode unset will happily
      # re-commit it that way, so assert the mode in the index rather than on disk.
      - name: Assert gradlew is executable in the index
        run: |
          set -euo pipefail
          MODE=$(git ls-files --stage -- gradlew | awk '{print $1}')
          if [ "$MODE" != "100755" ]; then
            echo "::error file=gradlew::gradlew is mode ${MODE:-missing} in the git index, expected 100755."
            echo "Fix with: git update-index --chmod=+x gradlew && git commit -m 'fix(ci): mark gradlew executable'"
            exit 1
          fi
          echo "gradlew is $MODE in the index."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        id: unit_tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Upload unit test report
        if: ${{ failure() && steps.unit_tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          if-no-files-found: warn
          retention-days: 14

      # Not redundant with the unit tests: this is the only job that runs R8 over
      # proguard-rules.pro. The Drive client resolves types reflectively, so a
      # missing keep rule shows up here and nowhere else.
      - name: Minified release build
        run: ./gradlew :app:assembleRelease --no-daemon

  instrumented:
    # This name is the status-check context, exactly as for "Build and test"
    # above: renaming this job renames the check GitHub reports, so any branch
    # protection that comes to require it would silently stop seeing it. Issue
    # #43 is what makes this check required on main; until then it reports but
    # gates nothing. Change the ruleset and this line together, or not at all.
    name: Instrumented tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      # The emulator needs hardware acceleration to be usable on a hosted
      # runner. KVM exists on ubuntu-latest but is not world-accessible by
      # default, so the runner user cannot open /dev/kvm without this.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Provisioning an AVD and booting it cold costs several minutes. Caching
      # the created AVD plus its snapshot lets later runs boot from the snapshot
      # instead. The key pins every property that changes the image, so bumping
      # the API level or target below invalidates the cache rather than
      # restoring an AVD that no longer matches.
      - name: Cache AVD
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb_keys
          key: avd-api34-google_apis-x86_64

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Instrumented tests
        id: instrumented_tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon

      # An emulator failure is near-impossible to diagnose from the step log
      # alone: the useful detail is in the per-test HTML report and the XML
      # results, both of which die with the runner.
      - name: Upload instrumented test report
        if: ${{ failure() && steps.instrumented_tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-report
          path: |
            app/build/reports/androidTests/connected
            app/build/outputs/androidTest-results/connected
          if-no-files-found: warn
          retention-days: 14
