name: Release to Play Console

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play Console track to publish to"
        required: true
        default: internal
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      status:
        description: "Release status on the chosen track"
        required: true
        default: completed
        type: choice
        options:
          - completed
          - draft
          - inProgress

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      # Mirrors the arithmetic in app/build.gradle.kts, purely so the version is visible
      # in the run summary and can name the Play release. The build derives its own.
      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          NAME=$(grep -E '^VERSION_NAME=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          BASE=$(grep -E '^VERSION_CODE_BASE=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          CODE=$(( BASE + GITHUB_RUN_NUMBER ))
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          {
            echo "### Release $NAME (versionCode $CODE)"
            echo ""
            echo "- Track: \`${{ github.event.inputs.track }}\`"
            echo "- Status: \`${{ github.event.inputs.status }}\`"
            echo "- Version code: \`$BASE\` (base) + \`$GITHUB_RUN_NUMBER\` (run) = \`$CODE\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build signed release AAB
        env:
          RELEASE_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload to Play Console
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.backrecorderapp
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track }}
          status: ${{ github.event.inputs.status }}
          releaseName: ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})
          mappingFile: app/build/outputs/mapping/release/mapping.txt
